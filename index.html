<style>
/* Layout: one-column phone app. Sticky top bar, fixed bottom tab bar, full-screen sheet for editing a record. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --sunk:#E6EBE8; --ink:#16201D; --muted:#56645E; --line:#D3DBD7;
  --accent:#0A6B5C; --accent-ink:#FFFFFF; --accent-soft:#D9EDE7;
  --run:#9E4A0A; --run-soft:#FAE8D8;
  --warn:#6E4A00; --warn-soft:#FFF0C7;
  --lock:#3B4E85; --lock-soft:#E2E7F5;
  --danger:#A12A2A;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#161E1B; --sunk:#1F2925; --ink:#E5ECE9; --muted:#9BA9A3; --line:#2B3632;
    --accent:#45B8A2; --accent-ink:#04201A; --accent-soft:#16352E;
    --run:#F0A35C; --run-soft:#3A2614;
    --warn:#F3C766; --warn-soft:#3A2F10;
    --lock:#A3B5EA; --lock-soft:#1E2640;
    --danger:#F08080;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#161E1B; --sunk:#1F2925; --ink:#E5ECE9; --muted:#9BA9A3; --line:#2B3632;
  --accent:#45B8A2; --accent-ink:#04201A; --accent-soft:#16352E;
  --run:#F0A35C; --run-soft:#3A2614;
  --warn:#F3C766; --warn-soft:#3A2F10;
  --lock:#A3B5EA; --lock-soft:#1E2640;
  --danger:#F08080;
  color-scheme:dark;
}
html{font-size:17px}
@supports (font: -apple-system-body){ html{font:-apple-system-body} }
body{font-family:var(--sans);font-size:1rem;line-height:1.45;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.6rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:0}
.runpill{display:flex;align-items:center;gap:.45rem;background:var(--run-soft);color:var(--run);border:1px solid var(--run);border-radius:999px;padding:.3rem .8rem;font-weight:600;font-size:.9rem;cursor:pointer;min-width:0}
.runpill span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--run);flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:1rem calc(6.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem}

h2.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.5rem 0 -.25rem;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.1rem;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;min-height:3.6rem;font-size:1.1rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:2.5rem;padding:.35rem .85rem;font-size:.92rem}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:.5rem 0;cursor:pointer;min-height:2.75rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:.8rem 1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;font-size:.92rem}
.banner .link{color:var(--warn);text-decoration:underline;padding:0;min-height:0}

.daysum{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.daysum span{color:var(--muted)}
.daysum b{font-family:var(--mono);font-size:1.5rem;font-weight:600}

.runcard{background:var(--run-soft);border:1px solid var(--run);border-radius:16px;padding:1.1rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.runlabel{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--run);font-weight:700;display:flex;align-items:center;gap:.4rem}
.runproj{font-size:1.3rem;font-weight:700;line-height:1.2}
.runclient,.since{color:var(--muted);font-size:.92rem}
.elapsed{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:3rem;font-weight:600;color:var(--run);line-height:1.1;margin:.35rem 0 .1rem}
.btn.stop{background:var(--run);border-color:var(--run);color:var(--surface);margin-top:.5rem}
.runcard .link{color:var(--run);align-self:center}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.75rem;padding:.85rem 1rem;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pinfo{min-width:0}
.pname{font-weight:600;font-size:1.08rem;line-height:1.25}
.pmeta{color:var(--muted);font-size:.88rem}
.btn.start{min-width:6.2rem}
.btn.start.on{background:var(--run-soft);border-color:var(--run);color:var(--run)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:1.2rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:.75rem;align-items:center}

.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:.5rem;gap:1rem}
.mhead h3{margin:0;font-size:1.05rem;text-transform:capitalize}
.mhead span{font-family:var(--mono);color:var(--muted);font-size:.9rem}
.erow{display:grid;grid-template-columns:3.2rem 1fr auto;gap:.75rem;align-items:start;padding:.8rem 1rem;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.erow:first-child{border-top:0}
.edate{font-family:var(--mono);font-weight:600;font-size:.95rem;line-height:1.3}
.edate small{display:block;color:var(--muted);font-family:var(--sans);font-weight:500}
.ebody{min-width:0}
.eproj{font-size:.85rem;color:var(--muted);font-weight:600}
.etext{overflow-wrap:anywhere}
.etext.miss{color:var(--muted);font-style:italic}
.edur{font-family:var(--mono);font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem}
.chip{font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:.1rem .45rem}
.chip.chk{background:var(--warn-soft);color:var(--warn)}
.chip.lock{background:var(--lock-soft);color:var(--lock)}

.field{display:flex;flex-direction:column;gap:.3rem}
label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:3rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.55rem .75rem}
textarea{min-height:7rem;resize:vertical;line-height:1.4}
input:disabled,select:disabled,textarea:disabled{background:var(--sunk);color:var(--muted)}
.filter{display:grid;grid-template-columns:1fr;gap:.3rem}

.monthnav{display:grid;grid-template-columns:3rem 1fr 3rem;align-items:center;gap:.5rem}
.monthnav b{text-align:center;font-size:1.15rem;text-transform:capitalize}
.monthnav button{min-height:3rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer}

.sum{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1rem}
.sum div{min-width:0}
.sum .k{font-size:.8rem;color:var(--muted);font-weight:600}
.sum .v{font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.sum .v.big{color:var(--accent)}
.status{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem}
.pill{border-radius:999px;padding:.2rem .7rem;font-size:.85rem;font-weight:600}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--lock-soft);color:var(--lock)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.bproj{padding:.65rem 1rem;background:var(--sunk);font-weight:700;display:flex;justify-content:space-between;gap:1rem}
.bproj span{font-family:var(--mono);font-weight:600}
.bline{padding:.75rem 1rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.25rem}
.bline.chk{background:var(--warn-soft)}
.bl-top{display:flex;justify-content:space-between;gap:1rem;font-family:var(--mono);font-size:.92rem;color:var(--muted)}
.btext{overflow-wrap:anywhere}
.btext i{color:var(--muted)}
.bl-act{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.3rem}
.flag{color:var(--warn);font-weight:700;font-size:.85rem;flex:1 1 10rem}
.bline.chk .btn.small{background:var(--surface)}
.bline.chk .btn.small.ok{background:var(--accent);color:var(--accent-ink)}
.warnline{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:.7rem .9rem;margin:0;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.invcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.invcard h4{margin:0;font-size:1.05rem}
.invcard .meta{color:var(--muted);font-size:.9rem}
.invcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.35rem;font-size:.92rem}
.invcard li{display:grid;grid-template-columns:3.3rem 1fr auto;gap:.5rem}
.invcard li .num{color:var(--muted)}

.setc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.setc h3{margin:0;font-size:1.05rem}
.srow{display:grid;grid-template-columns:1fr 6rem;gap:.5rem;align-items:end;padding-top:.7rem;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0;padding-top:0}
.srow .full{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.5rem}
.hint{color:var(--muted);font-size:.88rem;margin:0}
.note{border-radius:10px;padding:.7rem .9rem;margin:0;font-size:.92rem}
.note.lock{background:var(--lock-soft);color:var(--lock)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;min-height:3.6rem;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;border-top:3px solid transparent}
nav.tabs button svg{width:1.4rem;height:1.4rem}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(.5rem + env(safe-area-inset-top,0px)) calc(2rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.9rem}
.sheet-head{display:grid;grid-template-columns:5rem 1fr 5rem;align-items:center}
.sheet-head h2{margin:0;text-align:center;font-size:1.15rem}
.dur{display:flex;align-items:center;gap:.5rem}
.dur input{width:5.5rem;text-align:center;font-family:var(--mono);font-size:1.2rem}
.dur span{color:var(--muted);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:.4rem}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .9rem;min-height:2.6rem;cursor:pointer;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:2.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.autoflag{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:.45rem .7rem;font-weight:600;font-size:.88rem;margin:0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:.65rem 1rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}
#copyfb{position:fixed;inset:0;z-index:70;background:var(--bg);padding:calc(1rem + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(1rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:.75rem}
#copyfb textarea{flex:1;font-family:var(--mono);font-size:.85rem}
</style>

  <div class="brand">Ajaarvestus<small id="todayLbl"></small></div>
  <div id="topRun"></div>
</div></header>

  <button data-act="tab" data-id="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Ajalugu</button>

</div></nav>

<script>
(function(){
"use strict";
const KEY = 'ajaarvestus.v1';
const MONTHS = ['jaanuar','veebruar','märts','aprill','mai','juuni','juuli','august','september','oktoober','november','detsember'];
const WD = ['P','E','T','K','N','R','L'];
const $ = s => document.querySelector(s);

function uid(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return iso(new Date()); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return iso(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDur(min){ min = Math.round(min||0); const h = Math.floor(min/60), m = min%60; if(!h) return m+' min'; return h+' h '+String(m).padStart(2,'0')+' min'; }
function fmtDurShort(min){ const h = Math.floor(min/60), m = min%60; return h+':'+String(m).padStart(2,'0'); }
function hoursStr(min){ return (min/60).toFixed(2).replace('.',','); }
function money(x){ return (Math.round(x*100)/100).toFixed(2).replace('.',','); }
function eur(x){ return money(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €'; }
function fmtClock(ms){ const s = Math.max(0,Math.floor(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function hm(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDate(s){ const [y,m,d] = s.split('-'); return d+'.'+m+'.'+y; }
function dm(s){ const [,m,d] = s.split('-'); return d+'.'+m; }
function wd(s){ const [y,m,d] = s.split('-').map(Number); return WD[new Date(y,m-1,d).getDay()]; }
function ymLabel(ym){ const [y,m] = ym.split('-').map(Number); return MONTHS[m-1]+' '+y; }
function ymShift(ym,n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y,m-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function firstSentence(t){
  t = (t||'').trim(); if(!t) return '';
  const line = t.split(/\n/)[0].trim();
  const m = line.match(/^.*?[.!?](?=\s|$)/);
  let s = (m ? m[0] : line).trim();
  if(s.length > 160) s = s.slice(0,157).trim()+'…';
  return s;
}

/* ---------- data ---------- */
function seed(){
  const c1 = {id:'c1',name:'Veofirma (näide)',rate:45,sample:true};
  const c2 = {id:'c2',name:'Tööstusettevõte (näide)',rate:40,sample:true};
  const p1 = {id:'p1',clientId:'c1',name:'Transpordi planeerija',sample:true};
  const p2 = {id:'p2',clientId:'c2',name:'Näiduring',sample:true};
  const E = (projectId,date,minutes,official,priv,auto) => ({id:uid(),projectId,date,minutes,official,private:priv,auto:!!auto,approved:!auto,invoiceId:null,sample:true});
  return {
    clients:[c1,c2], projects:[p1,p2], invoices:[], timer:null,
    entries:[
      E('p1',daysAgo(0),40,'Kontseptsiooni arutelu ja nõuete kogumine','Ajurünnak autos. Kliendi kodutöö alles tulemata.'),
      E('p1',daysAgo(1),95,'Planeerimislaua mustand valmis.','Planeerimislaua mustand valmis. Lohistamine telefonis veel kehv, proovi puudutusega valikut.',true),
      E('p2',daysAgo(2),120,'Exceli ekspordi parandus','Lugeja nimi failinimes oli vale. Minu enda viga.'),
      E('p2',daysAgo(3),60,'Kasutusjuhendi täiendamine','')
    ]
  };
}
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load() || seed();
S.clients = S.clients||[]; S.projects = S.projects||[]; S.entries = S.entries||[]; S.invoices = S.invoices||[];

const UI = { tab:'timer', month:today().slice(0,7), billClient:null, histClient:'', cancelArm:false, armed:null, pendingImport:null };

const proj = id => S.projects.find(p => p.id === id);
const client = id => S.clients.find(c => c.id === id);
const projClientId = pid => { const p = proj(pid); return p ? p.clientId : null; };
const clientName = p => { const c = p && client(p.clientId); return c ? c.name : ''; };
const projName = pid => { const p = proj(pid); return p ? p.name : '(kustutatud projekt)'; };
const needsCheck = e => !e.official || (e.auto && !e.approved);
const hasSamples = () => S.clients.some(x=>x.sample) || S.projects.some(x=>x.sample) || S.entries.some(x=>x.sample);
const sumMin = list => list.reduce((a,e) => a + (e.minutes||0), 0);

/* ---------- UI helpers ---------- */
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

function render(){
  $('#todayLbl').textContent = fmtDate(today());
  document.querySelectorAll('nav.tabs button').forEach(b => { if(b.dataset.id === UI.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(S.timer && UI.tab !== 'timer'){
    const p = proj(S.timer.projectId);
    $('#topRun').innerHTML = `<button class="runpill" data-act="tab" data-id="timer"><i class="dot"></i><span class="n">${esc(p?p.name:'')}</span><span class="num" id="elapsed2">${fmtClock(Date.now()-S.timer.start)}</span></button>`;
  } else $('#topRun').innerHTML = '';
  const m = $('#main');
  if(UI.tab === 'timer') m.innerHTML = vTimer();
  else if(UI.tab === 'history') m.innerHTML = vHistory();
  else if(UI.tab === 'billing') m.innerHTML = vBilling();
  else m.innerHTML = vSettings();
}

function sampleBanner(){
  return hasSamples() ? `<div class="banner"><span>Siin on näidisandmed, et näeksid, kuidas tööriist töötab.</span><button class="link" data-act="clearSamples">${UI.armed==='samples'?'Kinnita: kustuta näidised':'Kustuta näidised'}</button></div>` : '';
}

/* ---------- Taimer ---------- */
function vTimer(){
  let h = sampleBanner();
  const t = today();
  h += `<div class="daysum"><span>Täna kokku</span><b>${fmtDur(sumMin(S.entries.filter(e=>e.date===t)))}</b></div>`;
  if(S.timer){
    const p = proj(S.timer.projectId);
    h += `<section class="runcard" aria-live="polite">
      <div class="runlabel"><i class="dot"></i>Käib</div>
      <div class="runproj">${esc(p?p.name:'?')}</div>
      <div class="runclient">${esc(clientName(p))}</div>
      <div class="elapsed" id="elapsed">${fmtClock(Date.now()-S.timer.start)}</div>
      <div class="since">Alustasid kell ${hm(S.timer.start)}</div>
      <button class="btn big stop" data-act="stop">Lõpeta ja lisa märkus</button>
      <button class="link" data-act="cancelTimer">${UI.cancelArm?'Kinnita: viska see aeg ära':'Tühista ilma salvestamata'}</button>
    </section>`;
  }
  const active = S.projects.filter(p => !p.archived);
  h += `<h2 class="sec">Projektid</h2>`;
  if(!active.length){
    h += `<div class="empty"><span>Projekte veel pole. Lisa klient ja tema projekt, siis saad aega mõõta.</span><button class="btn" data-act="tab" data-id="settings">Lisa projekt</button></div>`;
  } else {
    h += '<div class="list">' + active.map(p => {
      const on = S.timer && S.timer.projectId === p.id;
      const tm = sumMin(S.entries.filter(e => e.projectId===p.id && e.date===t));
      return `<div class="prow"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="pmeta">${esc(clientName(p))}${tm?' · täna '+fmtDur(tm):''}</div></div>
        <button class="btn start${on?' on':''}" data-act="start" data-id="${p.id}" ${on?'disabled':''}>${on?'Käib':'Alusta'}</button></div>`;
    }).join('') + '</div>';
  }
  h += `<button class="btn big ghost" data-act="manual" ${active.length?'':'disabled'}>+ Lisa aeg käsitsi</button>
        <p class="hint">Käsitsi lisamine sobib ka mõtlemis- ja arutelude ajale, näiteks autos või lennukis.</p>`;
  return h;
}

/* ---------- Ajalugu ---------- */
function vHistory(){
  let list = S.entries.slice();
  if(UI.histClient) list = list.filter(e => projClientId(e.projectId) === UI.histClient);
  list.sort((a,b) => b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  let h = `<div class="filter"><label for="histClient">Klient</label><select id="histClient" data-bind="histClient"><option value="">Kõik kliendid</option>${S.clients.map(c=>`<option value="${c.id}" ${UI.histClient===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
  if(!list.length) return h + `<div class="empty">Kirjeid veel pole. Alusta taimerit või lisa aeg käsitsi.</div>`;
  const groups = {};
  list.forEach(e => { const k = e.date.slice(0,7); (groups[k] = groups[k] || []).push(e); });
  Object.keys(groups).sort().reverse().forEach(k => {
    const g = groups[k];
    h += `<div class="mhead"><h3>${ymLabel(k)}</h3><span>${fmtDur(sumMin(g))}</span></div><div class="list">`;
    h += g.map(e => {
      const txt = e.official || e.private;
      const chips = (e.invoiceId?'<span class="chip lock">Arveldatud</span>':'') + (!e.invoiceId && needsCheck(e)?'<span class="chip chk">Kontrolli</span>':'');
      return `<button class="erow" data-act="edit" data-id="${e.id}">
        <div class="edate">${dm(e.date)}<small>${wd(e.date)}</small></div>
        <div class="ebody"><div class="eproj">${esc(projName(e.projectId))}</div><div class="etext${txt?'':' miss'}">${txt?esc(txt):'Märkus puudub'}</div>${chips?'<div class="chips">'+chips+'</div>':''}</div>
        <div class="edur">${fmtDurShort(e.minutes)}</div></button>`;
    }).join('') + '</div>';
  });
  return h;
}

/* ---------- Arveldus ---------- */
function vBilling(){
  if(!S.clients.length) return `<div class="empty">Kliente veel pole.<button class="btn" data-act="tab" data-id="settings">Lisa klient</button></div>`;
  if(!UI.billClient || !client(UI.billClient)) UI.billClient = S.clients[0].id;
  const c = client(UI.billClient), ym = UI.month;
  const all = S.entries.filter(e => e.date.startsWith(ym) && projClientId(e.projectId) === c.id).sort((a,b)=>a.date.localeCompare(b.date));
  const unb = all.filter(e => !e.invoiceId);
  const invs = S.invoices.filter(i => i.clientId===c.id && i.month===ym);
  const checks = unb.filter(needsCheck).length;
  const rate = Number(c.rate)||0;
  const unbAmount = amountFor(unb, rate);

  let h = `<div class="monthnav"><button data-act="month" data-id="-1" aria-label="Eelmine kuu">‹</button><b>${ymLabel(ym)}</b><button data-act="month" data-id="1" aria-label="Järgmine kuu">›</button></div>
  <div class="field"><label for="billClient">Klient</label><select id="billClient" data-bind="billClient">${S.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  <div class="sum">
    <div><div class="k">Kuus kokku</div><div class="v">${hoursStr(sumMin(all))} h</div></div>
    <div><div class="k">Tunnihind</div><div class="v">${rate?eur(rate):'—'}</div></div>
    <div><div class="k">Arveldamata</div><div class="v">${hoursStr(sumMin(unb))} h</div></div>
    <div><div class="k">Summa</div><div class="v big">${rate?eur(unbAmount):'—'}</div></div>
    <div class="status">${unb.length?'<span class="pill open">Arveldamata</span>':''}${invs.map(i=>`<span class="pill done">Arveldatud${i.number?' · arve '+esc(i.number):''}</span>`).join('')}${checks?`<span class="pill warn">${checks} kontrollida</span>`:''}</div>
  </div>`;

  if(!all.length) return h + `<div class="empty">Selle kliendi kohta pole sel kuul kirjeid.</div>`;

  if(unb.length){
    h += `<h2 class="sec">Arveldamata read</h2><div class="list">`;
    const byP = {};
    unb.forEach(e => (byP[e.projectId] = byP[e.projectId] || []).push(e));
    Object.keys(byP).forEach(pid => {
      h += `<div class="bproj">${esc(projName(pid))}<span>${hoursStr(sumMin(byP[pid]))} h</span></div>`;
      h += byP[pid].map(e => {
        const chk = needsCheck(e);
        return `<div class="bline${chk?' chk':''}">
          <div class="bl-top"><span>${fmtDate(e.date)}</span><span>${hoursStr(e.minutes)} h</span></div>
          <div class="btext">${e.official?esc(e.official):'<i>Ametlik märkus puudub</i>'}</div>
          ${chk?`<div class="bl-act"><span class="flag">${e.official?'Võetud sinu oma märkustest':'Lisa ametlik märkus'}</span>${e.official?`<button class="btn small ok" data-act="approve" data-id="${e.id}">Kinnita</button>`:''}<button class="btn small ghost" data-act="edit" data-id="${e.id}">Muuda</button></div>`:''}
        </div>`;
      }).join('');
    });
    h += `</div>`;
    h += `<div class="actions"><button class="btn ghost" data-act="copyTable" data-id="unbilled">Kopeeri tabel</button><button class="btn ghost" data-act="exportCsv" data-id="unbilled">Ekspordi Excelisse</button></div>`;
    if(checks) h += `<p class="warnline">${checks===1?'1 rida vajab':checks+' rida vajab'} enne arveldamist kontrolli.</p>`;
    h += `<div class="field"><label for="invNo">Arve number</label><input id="invNo" inputmode="text" autocomplete="off" placeholder="nt 2026-014"></div>
      <button class="btn big" data-act="invoice" ${checks?'disabled':''}>Märgi arveldatuks</button>
      <p class="hint">Arveldatud read lukustuvad, et neid kogemata ei muudetaks ega arveldataks kaks korda.</p>`;
  }

  if(invs.length){
    h += `<h2 class="sec">Arveldatud</h2>`;
    invs.forEach(i => {
      const es = S.entries.filter(e => e.invoiceId === i.id).sort((a,b)=>a.date.localeCompare(b.date));
      h += `<div class="invcard"><h4>${i.number?'Arve '+esc(i.number):'Arve ilma numbrita'}</h4>
        <div class="meta">Märgitud ${fmtDate(i.date)} · ${hoursStr(sumMin(es))} h · ${i.rate?eur(amountFor(es,i.rate)):'tunnihind puudub'}</div>
        <ul>${es.map(e=>`<li><span class="num">${dm(e.date)}</span><span>${esc(e.official)}</span><span class="num">${hoursStr(e.minutes)}</span></li>`).join('')}</ul>
        <div class="actions"><button class="btn small ghost" data-act="copyTable" data-id="${i.id}">Kopeeri tabel</button><button class="btn small ghost" data-act="exportCsv" data-id="${i.id}">Ekspordi Excelisse</button></div>
        <button class="btn small danger${UI.armed==='inv:'+i.id?' armed':''}" data-act="uninvoice" data-id="${i.id}">${UI.armed==='inv:'+i.id?'Kinnita: tühista arveldus':'Tühista arveldus'}</button>
      </div>`;
    });
  }
  return h;
}
function rowAmount(e, rate){ return Math.round(e.minutes/60*rate*100)/100; }
function amountFor(list, rate){ return list.reduce((a,e) => a + rowAmount(e, rate), 0); }

/* ---------- editor sheet ---------- */
let ED = null;
function openEditor(e, isNew, justStopped){
  ED = { e: JSON.parse(JSON.stringify(e)), isNew: !!isNew, justStopped: !!justStopped, orig: e.official||'', armDel:false };
  renderEditor();
}
function closeEditor(){ ED = null; const o = $('#sheet'); o.hidden = true; o.innerHTML = ''; document.body.classList.remove('noscroll'); }
function renderEditor(){
  const o = $('#sheet'), e = ED.e, locked = !!e.invoiceId, dis = locked ? 'disabled' : '';
  const inv = locked ? S.invoices.find(i => i.id === e.invoiceId) : null;
  const projs = S.projects.filter(p => !p.archived || p.id === e.projectId);
  const startTab = (ED.justStopped && !e.official) ? 'priv' : 'off';
  o.innerHTML = `<div class="sheet-in">
    <div class="sheet-head"><button class="link" data-act="edClose">‹ Tagasi</button><h2>${ED.justStopped?'Mida sa tegid?':ED.isNew?'Lisa aeg':'Kirje'}</h2><span></span></div>
    ${ED.justStopped?`<p class="hint">Salvestatud ${fmtDur(e.minutes)}. Lisa märkus kohe või hiljem Ajaloos.</p>`:''}
    ${locked?`<p class="note lock">Arveldatud${inv&&inv.number?', arve '+esc(inv.number):''}. Muutmiseks tühista arveldus Arvelduse vaates.</p>`:''}
    <div class="field"><label for="edProject">Projekt</label><select id="edProject" ${dis}>${projs.map(p=>`<option value="${p.id}" ${p.id===e.projectId?'selected':''}>${esc(p.name)} · ${esc(clientName(p))}</option>`).join('')}</select></div>
    <div class="field"><label for="edDate">Kuupäev</label><input type="date" id="edDate" value="${e.date}" ${dis}></div>
    <div class="field"><span class="lbl">Kestus</span>
      <div class="dur"><input id="edH" type="number" inputmode="numeric" min="0" value="${Math.floor(e.minutes/60)}" aria-label="Tunnid" ${dis}><span>h</span><input id="edM" type="number" inputmode="numeric" min="0" max="59" value="${e.minutes%60}" aria-label="Minutid" ${dis}><span>min</span></div>
      ${locked?'':`<div class="quick">${[15,30,45,60,90,120].map(n=>`<button data-act="setDur" data-id="${n}">${n<60?n+' min':(n/60+' h').replace('.',',')}</button>`).join('')}</div>`}
    </div>
    <div class="seg" role="tablist">
      <button role="tab" data-act="edTab" data-id="off" aria-selected="${startTab==='off'}">Ametlik</button>
      <button role="tab" data-act="edTab" data-id="priv" aria-selected="${startTab==='priv'}">Oma märkused</button>
    </div>
    <div class="field" id="paneOff" ${startTab==='off'?'':'hidden'}>
      <textarea id="edOff" placeholder="Läheb arvele, nt: Planeerimislaua kujundus" ${dis}>${esc(e.official)}</textarea>
      ${e.auto && !e.approved ? `<p class="autoflag">Võetud sinu oma märkustest. Kontrolli enne arveldamist.</p>` : ''}
      <p class="hint">Läheb arvele selle kuupäeva reale. Kui jätad tühjaks, võetakse oma märkuste esimene lause.</p>
    </div>
    <div class="field" id="panePriv" ${startTab==='priv'?'':'hidden'}>
      <textarea id="edPriv" placeholder="Ainult sulle: mis sai tehtud, mis jäi pooleli…" ${dis}>${esc(e.private)}</textarea>
      <p class="hint">Need märkused on ainult sinu jaoks ega lähe arvele.</p>
    </div>
    ${locked?'':`<button class="btn big" data-act="edSave">Salvesta</button>`}
    ${(!locked && !ED.isNew)?`<button class="btn danger" data-act="edDel">Kustuta kirje</button>`:''}
  </div>`;
  o.hidden = false; o.scrollTop = 0; document.body.classList.add('noscroll');
}
function editorSave(){
  const e = ED.e;
  const pid = $('#edProject').value;
  const date = $('#edDate').value;
  const minutes = (parseInt($('#edH').value,10)||0)*60 + (parseInt($('#edM').value,10)||0);
  if(!pid || !proj(pid)){ toast('Vali projekt'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ toast('Vali kuupäev'); return; }
  if(minutes <= 0){ toast('Sisesta kestus'); return; }
  const off = $('#edOff').value.trim(), priv = $('#edPriv').value.trim();
  e.projectId = pid; e.date = date; e.minutes = minutes; e.private = priv;
  if(!off){
    if(priv){ e.official = firstSentence(priv); e.auto = true; e.approved = false; }
    else { e.official = ''; e.auto = false; e.approved = true; }
  } else if(e.auto && off === ED.orig){
    const fs = firstSentence(priv);
    if(fs && fs !== ED.orig){ e.official = fs; e.approved = false; } else e.official = off;
  } else { e.official = off; e.auto = false; e.approved = true; }
  if(ED.isNew){ e.ts = Date.now(); S.entries.push(e); }
  else { const i = S.entries.findIndex(x => x.id === e.id); if(i >= 0) S.entries[i] = e; else S.entries.push(e); }
  save(); closeEditor(); render();
  toast(e.auto && !e.approved ? 'Salvestatud. Ametlik märkus võeti sinu märkustest.' : 'Salvestatud');
}

/* ---------- export ---------- */
function exportSet(id){
  const c = client(UI.billClient);
  if(id === 'unbilled'){
    const list = S.entries.filter(e => !e.invoiceId && e.date.startsWith(UI.month) && projClientId(e.projectId) === c.id);
    return { list, rate:Number(c.rate)||0, label:'arveldamata' };
  }
  const inv = S.invoices.find(i => i.id === id);
  return { list:S.entries.filter(e => e.invoiceId === id), rate:inv.rate||0, label: inv.number ? 'arve-'+inv.number : 'arve' };
}
function tableRows(list, rate){
  const rows = [['Kuupäev','Projekt','Töö kirjeldus','Tunnid','Tunnihind','Summa']];
  let tm = 0, ta = 0;
  list.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
    const a = rowAmount(e, rate); tm += e.minutes; ta += a;
    rows.push([fmtDate(e.date), projName(e.projectId), e.official||'', hoursStr(e.minutes), rate?money(rate):'', rate?money(a):'']);
  });
  rows.push(['','','Kokku',hoursStr(tm),'',rate?money(ta):'']);
  return rows;
}
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'klient'; }
async function deliverFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try{
    const file = new File([blob], name, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  try{
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Fail '+name+' on valmis');
  }catch(err){ toast('Faili ei saanud salvestada'); }
}
function copyText(text){
  const fb = () => { $('#copyText').value = text; $('#copyfb').hidden = false; setTimeout(()=>{ const t = $('#copyText'); t.focus(); t.select(); }, 50); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('Tabel kopeeritud. Kleebi see Excelisse.'), fb);
    } else fb();
  }catch(e){ fb(); }
}

/* ---------- actions ---------- */
const ACT = {
  tab(b,id){ UI.tab = id; UI.armed = null; UI.cancelArm = false; render(); window.scrollTo(0,0); },
  start(b,id){
    if(S.timer){ stopTimer(false); toast('Eelmine aeg salvestati. Märkuse saad lisada Ajaloos.'); }
    S.timer = { projectId:id, start:Date.now() }; UI.cancelArm = false; save(); render();
  },
  stop(){ stopTimer(true); },
  cancelTimer(){
    if(!UI.cancelArm){ UI.cancelArm = true; render(); return; }
    S.timer = null; UI.cancelArm = false; save(); render(); toast('Taimer tühistati');
  },
  manual(){
    const last = S.entries.slice().sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
    const act = S.projects.filter(p=>!p.archived);
    const pid = (last && act.some(p=>p.id===last.projectId)) ? last.projectId : (act[0] && act[0].id);
    openEditor({ id:uid(), projectId:pid, date:today(), minutes:30, official:'', private:'', auto:false, approved:true, invoiceId:null }, true, false);
  },
  edit(b,id){ const e = S.entries.find(x => x.id === id); if(e) openEditor(e, false, false); },
  edClose(){ closeEditor(); render(); },
  edTab(b,id){
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.id === id)));
    $('#paneOff').hidden = id !== 'off'; $('#panePriv').hidden = id !== 'priv';
  },
  setDur(b,id){ const n = Number(id); $('#edH').value = Math.floor(n/60); $('#edM').value = n%60; },
  edSave(){ editorSave(); },
  edDel(b){
    if(!ED.armDel){ ED.armDel = true; b.textContent = 'Kinnita kustutamine'; b.classList.add('armed'); return; }
    S.entries = S.entries.filter(x => x.id !== ED.e.id); save(); closeEditor(); render(); toast('Kirje kustutati');
  },
  month(b,id){ UI.month = ymShift(UI.month, Number(id)); UI.armed = null; render(); },
  approve(b,id){ const e = S.entries.find(x => x.id === id); if(e && e.official){ e.approved = true; save(); render(); } },
  invoice(){
    const c = client(UI.billClient);
    const list = S.entries.filter(e => !e.invoiceId && e.date.startsWith(UI.month) && projClientId(e.projectId) === c.id);
    if(!list.length || list.some(needsCheck)) return;
    const inv = { id:uid(), clientId:c.id, month:UI.month, number:($('#invNo').value||'').trim(), date:today(), rate:Number(c.rate)||0 };
    S.invoices.push(inv); list.forEach(e => e.invoiceId = inv.id);
    save(); render(); toast(ymLabel(UI.month)+' märgiti arveldatuks');
  },
  uninvoice(b,id){
    if(UI.armed !== 'inv:'+id){ UI.armed = 'inv:'+id; render(); return; }
    S.entries.forEach(e => { if(e.invoiceId === id) e.invoiceId = null; });
    S.invoices = S.invoices.filter(i => i.id !== id); UI.armed = null; save(); render(); toast('Arveldus tühistati, read on taas muudetavad');
  },
  copyTable(b,id){ const x = exportSet(id); copyText(tableRows(x.list, x.rate).map(r => r.join('\t')).join('\n')); },
  exportCsv(b,id){
    const x = exportSet(id), c = client(UI.billClient);
    const cell = v => { v = String(v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    const csv = '﻿' + tableRows(x.list, x.rate).map(r => r.map(cell).join(';')).join('\r\n');
    deliverFile(`ajaarvestus_${slug(c.name)}_${UI.month}_${slug(x.label)}.csv`, csv, 'text/csv');
  },
  closeCopy(){ $('#copyfb').hidden = true; },
  clearSamples(){
    if(UI.armed !== 'samples'){ UI.armed = 'samples'; render(); return; }
    const sp = new Set(S.projects.filter(p=>p.sample).map(p=>p.id));
    S.entries = S.entries.filter(e => !e.sample && !sp.has(e.projectId));
    S.projects = S.projects.filter(p => !p.sample);
    S.clients = S.clients.filter(c => !c.sample || S.projects.some(p => p.clientId === c.id));
    S.invoices = S.invoices.filter(i => S.entries.some(e => e.invoiceId === i.id));
    if(S.timer && !proj(S.timer.projectId)) S.timer = null;
    UI.armed = null; UI.billClient = null; save(); render(); toast('Näidisandmed kustutati');
  },
  addClient(){
    const n = $('#newCName').value.trim(); if(!n){ toast('Sisesta kliendi nimi'); return; }
    S.clients.push({ id:uid(), name:n, rate:parseNum($('#newCRate').value) }); save(); render(); toast('Klient lisatud');
  },
  delClient(b,id){ S.clients = S.clients.filter(c => c.id !== id); save(); render(); },
  addProject(){
    const n = $('#newPName').value.trim(); if(!n){ toast('Sisesta projekti nimi'); return; }
    S.projects.push({ id:uid(), clientId:$('#newPClient').value, name:n }); save(); render(); toast('Projekt lisatud');
  },
  toggleProject(b,id){ const p = proj(id); p.archived = !p.archived; save(); render(); },
  delProject(b,id){ S.projects = S.projects.filter(p => p.id !== id); save(); render(); },
  backup(){ deliverFile(`ajaarvestus_varukoopia_${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  restore(){ $('#impFile').value = ''; $('#impFile').click(); },
  doImport(){ S = UI.pendingImport; S.invoices = S.invoices || []; UI.pendingImport = null; UI.billClient = null; save(); render(); toast('Varukoopia taastatud'); },
  cancelImport(){ UI.pendingImport = null; render(); }
};
function parseNum(v){ const n = parseFloat(String(v||'').replace(/\s/g,'').replace(',','.')); return isFinite(n) ? n : 0; }
function stopTimer(open){
  const t = S.timer; if(!t) return;
  const min = Math.max(1, Math.round((Date.now() - t.start)/60000));
  const e = { id:uid(), projectId:t.projectId, date:iso(new Date(t.start)), minutes:min, official:'', private:'', auto:false, approved:true, invoiceId:null, ts:Date.now() };
  S.entries.push(e); S.timer = null; UI.cancelArm = false; save(); render();
  if(open) openEditor(e, false, true);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if(f) f(b, b.dataset.id);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if(el.dataset.bind){ UI[el.dataset.bind] = el.value; render(); return; }
  if(el.dataset.edit === 'client'){ const c = client(el.dataset.id); if(!c) return; if(el.dataset.f === 'rate') c.rate = parseNum(el.value); else if(el.value.trim()) c.name = el.value.trim(); delete c.sample; save(); render(); }
  if(el.dataset.edit === 'project'){ const p = proj(el.dataset.id); if(!p) return; if(el.dataset.f === 'name'){ if(el.value.trim()) p.name = el.value.trim(); } else p[el.dataset.f] = el.value; delete p.sample; save(); render(); }
});
$('#impFile').addEventListener('change', ev => {
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.entries) || !Array.isArray(d.projects) || !Array.isArray(d.clients)) throw 0;
      UI.pendingImport = d; render();
    }catch(e){ toast('See fail ei ole ajaarvestuse varukoopia'); }
  };
  r.readAsText(f);
});
setInterval(() => {
  if(!S.timer) return;
  const s = fmtClock(Date.now() - S.timer.start);
  const a = document.getElementById('elapsed'); if(a) a.textContent = s;
  const b = document.getElementById('elapsed2'); if(b) b.textContent = s;
}, 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && !ED){ const fresh = load(); if(fresh) S = fresh; render(); } });

render();
})();
</script>
